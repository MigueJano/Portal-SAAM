{% load l10n %}{% if valor > 12 %}<span class="text-success text-nowrap" title="Superior a 12%"><i class="fas fa-arrow-up me-1" aria-hidden="true"></i><span class="visually-hidden">Tendencia positiva:</span>{{ valor|floatformat:2 }}%</span>{% elif valor < 0 %}<span class="text-danger text-nowrap" title="Menor a 0%"><i class="fas fa-arrow-down me-1" aria-hidden="true"></i><span class="visually-hidden">Tendencia negativa:</span>{{ valor|floatformat:2 }}%</span>{% else %}<span class="text-warning text-nowrap" title="Entre 0% y 12%"><i class="fas fa-minus me-1" aria-hidden="true"></i><span class="visually-hidden">Tendencia estable:</span>{{ valor|floatformat:2 }}%</span>{% endif %}
